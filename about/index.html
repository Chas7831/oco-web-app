678\",{\"d\":\"M8 16H3v5\"}],\"$undefined\"]}],[\"$\",\"p\",null,{\"className\":\"ml-2 md:ml-0 md:text-center font-bold\",\"children\":\"Unused allowance is automatically sold\"}]]}]]}],[\"$\",\"section\",null,{\"children\":[[\"$\",\"h1\",null,{\"children\":\"What is OCO ?\"}],[\"$\",\"p\",null,{\"children\":[\"OCO is an ERC20 token that represents carbon emissions, quantified in grams of \",[\"$\",\"a\",null,{\"href\":\"https://en.wikipedia.org/wiki/Global_warming_potential\",\"target\":\"_blank\",\"children\":\" CO₂ equivalent (CO₂e)\"}],\". Its issuance rate is based on emission scenarios from the \",[\"$\",\"a\",null,{\"href\":\"https://wedocs.unep.org/handle/20.500.11822/46404\",\"target\":\"_blank\",\"children\":\"UNEP Emissions Gap Report 2024\"}],\" (1.5°C scenario). OCO is distributed with an equal allowance to every human, ensuring a fair, transparent trading system that respects our carbon budget.\"]}],[\"$\",\"h1\",null,{\"children\":\"Why OCO ?\"}],[\"$\",\"p\",null,{\"children\":[\"Our planet has a limited capacity to absorb carbon emissions. We currently \",[\"$\",\"a\",null,{\"href\":\"https://www.unep.org/news-and-stories/statements/emissions-gap-report-2024-press-statement\",\"target\":\"_blank\",\"children\":\"emit more than nature can handle\"}],\", putting future generations at risk. OCO establishes a fixed carbon budget—similar to other scarce natural resources—where every individual receives an equal quota. This approach promotes accountability and fairness in managing our collective emissions while also rewarding sobriety.\"]}],[\"$\",\"h1\",null,{\"children\":\"How It Works\"}],[\"$\",\"h2\",null,{\"children\":\"Tokenomics\"}],[\"$\",\"ul\",null,{\"children\":[[\"$\",\"li\",null,{\"children\":[[\"$\",\"b\",null,{\"children\":\"No pre-allocation\"}],\": Tokens are issued solely through the allowance system.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"b\",null,{\"children\":\"Allowance Issuance\"}],\": Allowances are issued progressively e
