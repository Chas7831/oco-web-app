{amount} OCOをバーン\",\"msg_claim\":\"{amount} OCOを受領\",\"msg_settle\":\"{fSettleValue} {uSettleValue} を {amount} OCOと交換\",\"msg_withdraw\":\"{amount} OCOを {fWithdrawValue} {uWithdrawValue} と交換\",\"msg_burn\":\"{amount} OCOをバーン（合計: {total}）\"},\"HallOfFlame\":{\"title\":\"トップバーナー\",\"loading\":\"読み込み中...\",\"no_burn\":\"まだ誰もトークンをバーンしていません、怪しいですね-_-'\",\"unit\":\"単位\"},\"About\":{\"title\":\"概要\",\"subtitle\":\"O=C=O\",\"cards\":{\"represent\":\"OCOトークンはCO₂eグラム単位で定量化されたカーボン排出量を表します\",\"capped\":\"供給量は上限があり、人間同士で平等に割り当てられます\",\"sold\":\"未使用の割当量は自動的に売却されます\"},\"whatIsOCO\":{\"section\":\"OCOとは？\",\"p1\":\"OCOはカーボン排出量を定量化したERC20トークンで、\",\"link1\":\"CO₂換算（CO₂e）\",\"p2\":\"を表します。発行レートは\",\"link2\":\"UNEP Emissions Gap Report 2024\",\"p3\":\"（1.5°Cシナリオ）の排出シナリオに基づいています。OCOは全ての人に平等な割当量を配布し、公平で透明性のある取引システムを通じてカーボンバジェットを管理します。\"},\"whyOCO\":{\"section\":\"なぜOCOなのか？\",\"p1\":\"地球のカーボン吸収容量には限界があります。現在私たちは\",\"link\":\"自然が処理できる量を超えて排出\",\"p2\":\"しており、将来の世代を危険にさらしています。\",\"p3\":\" OCOは他の希少資源と同様に固定カーボンバジェットを設定し、個人に平等なクォータを配布します。このアプローチは責任と公平性を促進し、節度を保つことを奨励します。\"},\"howItWorks\":\"仕組み\",\"tokenomics\":{\"heading\":\"トークンエコノミクス\",\"noPreAllocationBold\":\"事前配布なし\",\"noPreAllocationDesc\":\"トークンは割当システムを通じてのみ発行されます\",\"allowanceIssuanceBold\":\"割当量の発行\",\"allowanceIssuanceDesc\":\"割当量はエポック期間中（約1年）、ブロックごとに段階的に発行されます。ブロックあたりの割当量はエポック総割当量を期間で分割した値です\",\"automaticSalesBold\":\"自動売却\",\"automaticSalesDesc\":\"未請求の割当量トークンはブロックごとに比例配分でオークションにかけられます\",\"noProtocolFeesBold\":\"プロトコル手数料なし\",\"noProtocolFeesDesc\":\"売却収益は全て割当保有者に直接分配されます\"},\"allowanceEligibility\":{\"heading\":\"割当資格\",\"item1\":\"本人確認後、各人はエポックごとに1つのPileus NFTをミントできます\",\"item2\":\"Pileus NFTを保有すると自動的にOCO割当量が付与されます\",\"item3\":\"NFTはエポック終了時に失効し、毎エポック更新が必要です\"},\"allowanceAmount\":{\"heading\":\"割当量\",\"intro\":\"割当量は1.5°Cシナリオに沿った排出経路に従いエポックごとに減少します:\",\"year2030Prefix\":\"2030年:\",\"year2030Value\":\"3.85 tCO₂e\",\"year2030Suffix\":\" 一人あたり\",\"year2035Prefix\":\"2035年:\",\"year2035Value\":\"2.81 tCO₂e\",\"year2035Suffix\":\" 一人あたり\"},\"claimingWithdrawing\":{\"heading\":\"請求と引き出し\",\"claimBold\":\"請求\",\"claimDesc\":\"ユーザーはOCO割当量の全部または一部をウォレットに請求でき、自動オークションから即時除外されます。請求後は通常のERC-20トークンとして扱われます\",\"withdrawBold\":\"引き出し\",\"withdrawDesc\":\"未請求割当量トークンは自動売却され、ブロックごとにETHを生成します。ユーザーはETH収益をいつでも引き出せます\"},\"tradingMechanism\":{\"heading\":\"取引メカニズム\",\"p\":\"各ブロックで未請求割当量トークンは比例配分オークションにかけられます。未請求割当量からのトークンのみがオークションに参加します\",\"buyBold\":\"購入\",\"buyDesc\":\"ETHを使用して誰でもOCOトークンを購入可能です。投資額はエポックの残りブロック数に均等分配され、最終価格は決済時に決定されます\",\"settleBold\":\"決済\",\"settleDesc\":\"購入者は過去ブロック分の最終価格を確定（「決済」）できます。価格は総投資ETHと未請求割当量の比率で計算されます\"},\"footer\":{\"text\":\"詳細は\",\"linkText\":\"ドキュメントサイト\"}}},\"now\":\"$undefined\",\"timeZone\":\"America/Los_Angeles\",\"children\":[\"$\",\"$L19\",null,{\"children\":[\"$\",\"$L1a\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"relative min-h-screen\",\"children\":[[\"$\",\"header\",null,{\"className\":\"sticky z-50 top-0 w-full h-16 border-b bg-background/80 backdrop-blur-sm\",\"children\":[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto w-full px-4 h-full flex items-center justify-between\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-center\",\"children\":[[\"$\",\"a\",null,{\"href\":\"/\",\"title\":\"Home\",\"className\":\"inline-block mr-4\",\"children\":[\"$\",\"svg\",null,{\"id\":\"pileusImg\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"viewBox\":\"0 0 69 26\",\"className\":\"h-12 transition-transform hover:scale-105\",\"children\":[\"$\",\"g\",null,{\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":3,\"strokeLinecap\":\"round\",\"children\":[[\"$\",\"path\",null,{\"d\":\"M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\"}],[\"$\",\"g\",null,{\"transform\":\"translate(22, 0)\",\"children\":[\"$\",\"path\",null,{\"d\":\"M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16\"}]}],[\"$\",\"g\",null,{\
