n equal quota. This approach promotes accountability and fairness in managing our collective emissions while also rewarding sobriety.\"},\"howItWorks\":\"How It Works\",\"tokenomics\":{\"heading\":\"Tokenomics\",\"noPreAllocationBold\":\"No pre-allocation\",\"noPreAllocationDesc\":\"Tokens are issued solely through the allowance system.\",\"allowanceIssuanceBold\":\"Allowance Issuance\",\"allowanceIssuanceDesc\":\"Allowances are issued progressively every block over each epoch (~one year). The per-block allowance equals the total epoch allowance divided by epoch duration.\",\"automaticSalesBold\":\"Automatic Sales\",\"automaticSalesDesc\":\"Unclaimed allowance tokens are auctioned pro-rata each block.\",\"noProtocolFeesBold\":\"No Protocol Fees\",\"noProtocolFeesDesc\":\"All proceeds from sales directly benefit allowance holders.\"},\"allowanceEligibility\":{\"heading\":\"Allowance Eligibility\",\"item1\":\"Each human mints exactly one Pileus NFT per epoch after proof-of-personhood verification.\",\"item2\":\"Holding a Pileus NFT automatically grants an OCO allowance.\",\"item3\":\"The NFT expires at the epoch's end, requiring renewal each epoch.\"},\"allowanceAmount\":{\"heading\":\"Allowance Amount\",\"intro\":\"The allowance amount decreases each epoch following emission pathways consistent with a 1.5°C scenario:\",\"year2030Prefix\":\"Year 2030:\",\"year2030Value\":\"3.85 tCO₂e\",\"year2030Suffix\":\" per capita\",\"year2035Prefix\":\"Year 2035:\",\"year2035Value\":\"2.81 tCO₂e\",\"year2035Suffix\":\" per capita\"},\"claimingWithdrawing\":{\"heading\":\"Claiming and Withdrawing\",\"claimBold\":\"Claim\",\"claimDesc\":\"Users can claim all or part of their OCO allowance to their own wallet, immediately removing those tokens from the automatic pro-rata auctions. Once claimed, the tokens behave like any standard ERC-20 asset.\",\"withdrawBold\":\"Withdraw\",\"withdrawDesc\":\"Unclaimed allowance tokens are auctioned automatically, generating ETH each block. Users c
